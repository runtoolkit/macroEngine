# MacroEngine Fabric — CI build (Minecraft 1.21.1 / Yarn)
name: Build
on:
  push:
    branches: [ main, master, develop ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:
jobs:
  build:
    name: Build (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: chmod +x gradlew && ./gradlew build --stacktrace --no-daemon
      - name: Package datapack/resourcepack zips
        run: ./gradlew packZips --stacktrace --no-daemon
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macroengine-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/libs/*.zip
          if-no-files-found: error
          retention-days: 14
  # Runs on tagged releases: git tag v1.2.3 && git push origin v1.2.3
  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Build release
        run: ./gradlew build --stacktrace --no-daemon
      - name: Package datapack/resourcepack zips
        run: chmod +x gradlew && ./gradlew packZips --stacktrace --no-daemon
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/libs/*.jar
            build/libs/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
