name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  push:
    branches: [main, devlop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  # =====================================================================
  # lint — mecha, JSON, mcfunction pre-check, pack.mcmeta
  # =====================================================================
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Mecha
        run: |
          echo "::group::Installing Mecha"
          pip install git+https://github.com/mcbeet/mecha.git
          echo "::endgroup::"
      - name: Gradle lint
        run: |
          echo "::group::Gradle lint"
          chmod +x gradlew && ./gradlew lint --no-daemon
          echo "::endgroup::"

  # =====================================================================
  # build — matrix zips (1_20_3, 1_20_5, pre_1_21_4, 1_21_5, 1_21_6, full)
  # =====================================================================
  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Gradle buildAll
        run: |
          echo "::group::Running Gradle buildAll + build"
          chmod +x gradlew && ./gradlew buildAll build --no-daemon
          echo "::endgroup::"
      - uses: actions/upload-artifact@v7
        with:
          name: macroEngine-datapacks
          path: |
            build/dist/*.zip
            build/libs/*.jar
          retention-days: 14
          if-no-files-found: error

  # =====================================================================
  # release — only on push to main
  # =====================================================================
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Gradle release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +x
          chmod +x gradlew
          ./gradlew zipFull --no-daemon
          ./gradlew release --no-daemon
          set -x

  # =====================================================================
  # generate-build-py — only on push to 'workflows' branch
  # =====================================================================
  generate-build-py:
    if: github.event_name == 'push' && github.ref == 'refs/heads/workflows'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run generate build script
        run: python3 .github/scripts/generate_buid-py.py
      - uses: actions/upload-artifact@v7
        with:
          name: build-py
          path: build.py
      - name: Commit and push build.py
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build.py
          git diff --cached --quiet && exit 0
          git commit -m "Auto generate build.py"
          git push origin HEAD:${GITHUB_REF#refs/heads/}

  archive:
    needs: [lint, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Gradle createSourceZip
        run: |
          echo "::group::Running createSourceZip"
          chmod +x gradlew && ./gradlew createSourceZip --no-daemon
          echo "::endgroup::"

      - uses: actions/upload-artifact@v7
        with:
          name: macroEngine-sources
          path: build/archive/source-with-history.zip
          retention-days: 14
          if-no-files-found: error
