plugins {
	id 'fabric-loom' version '1.9-SNAPSHOT'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	inputs.property 'version', project.version
	filesMatching('fabric.mod.json') {
		expand version: project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from('LICENSE') {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

publishing {
	publications {
		create('mavenJava', MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
}

// =====================================================================
// Datapack / Resourcepack zip packaging — injected into :jar
// Zips packs/macroEngine-Datapack and packs/macroEngine-Resourcepack
// and drops the zips next to the mod jar in build/libs/.
// =====================================================================

def datapackSrc     = file("packs/macroEngine-Datapack")
def resourcepackSrc = file("packs/macroEngine-Resourcepack")

tasks.register("zipDatapack", Zip) {
	group = "build"
	description = "Packages packs/macroEngine-Datapack as a .zip"
	onlyIf { datapackSrc.exists() }
	from(datapackSrc)
	archiveFileName.set("macroEngine-Datapack.zip")
	destinationDirectory.set(layout.buildDirectory.dir("libs"))
}

tasks.register("zipResourcepack", Zip) {
	group = "build"
	description = "Packages packs/macroEngine-Resourcepack as a .zip"
	onlyIf { resourcepackSrc.exists() }
	from(resourcepackSrc)
	archiveFileName.set("macroEngine-Resourcepack.zip")
	destinationDirectory.set(layout.buildDirectory.dir("libs"))
}

tasks.named("jar") {
	dependsOn "zipDatapack", "zipResourcepack"
}