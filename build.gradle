import groovy.json.JsonSlurper
import groovy.json.JsonOutput

plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.0-alpha.9'
    id 'java'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
    maven { url "https://maven.fabricmc.net/" }
}

dependencies {
    minecraft "com.mojang:minecraft:26.2"

    implementation "net.fabricmc:fabric-loader:0.19.3"
    implementation "net.fabricmc.fabric-api:fabric-api:0.155.2+26.2"
}

def TARGETS_PACK_FORMAT = 107 // main pack.mcmeta pack_format (modern data/, tekil isimler)

def macroEngineSrc = file("datapacks/macroEngine")
def extensionsSrc  = file("datapacks/macroengine_extensions")

def buildRoot = layout.buildDirectory.dir("datapack").get().asFile
def distRoot  = layout.buildDirectory.dir("dist").get().asFile

tasks.register("lintJson") {
    group = "verification"
    description = "Validates every *.json file parses as JSON"
    doLast {
        def slurper = new JsonSlurper()
        def failures = []
        fileTree(projectDir) {
            include "**/*.json"
            exclude ".git/**"
        }.each { f ->
            try {
                slurper.parse(f)
            } catch (Exception e) {
                failures << "${f}: ${e.message}"
            }
        }
        if (failures) {
            failures.each { logger.error("JSON error: ${it}") }
            throw new GradleException("${failures.size()} invalid JSON file(s) found.")
        }
        logger.lifecycle("All JSON files valid.")
    }
}

tasks.register("lintMcfunctionPrecheck") {
    group = "verification"
    description = "Scans *.mcfunction files for BOM, null bytes, CRLF"
    doLast {
        def errors = 0
        fileTree(projectDir) {
            include "**/*.mcfunction"
            exclude ".git/**"
        }.each { f ->
            byte[] bytes = f.bytes
            if (bytes.length >= 3 && (bytes[0] & 0xFF) == 0xEF && (bytes[1] & 0xFF) == 0xBB && (bytes[2] & 0xFF) == 0xBF) {
                logger.error("BOM detected: ${f}")
                errors++
            }
            if (bytes.any { it == 0 }) {
                logger.error("Null byte detected: ${f}")
                errors++
            }
            if (bytes.any { it == (byte) 0x0D }) {
                logger.error("CRLF line endings: ${f}")
                errors++
            }
        }
        if (errors > 0) {
            throw new GradleException("${errors} issue(s) found in .mcfunction files.")
        }
        logger.lifecycle("mcfunction pre-check passed.")
    }
}

tasks.register("lintMecha", Exec) {
    group = "verification"
    description = "Runs mecha against a patched scratch copy of the datapack"
    dependsOn "lintMcfunctionPrecheck"

    def scratch = layout.buildDirectory.dir("mecha-scratch").get().asFile

    doFirst {
        delete(scratch)
        mkdir(scratch)
        copy {
            from(projectDir) {
                exclude "build/**", ".git/**", ".github/**"
            }
            into(scratch)
        }

        fileTree(scratch) { include "**/*.mcfunction" }.each { f ->
            def text = f.getText("UTF-8")
            def patched = text
                .replaceAll(/([a-z0-9._-]+): _/, '$1:_')
                .replaceAll(/time of [a-z0-9_:.-]+ /, 'time ')
                .replace('time query day repetition', 'time query daytime')
            if (patched != text) {
                f.setText(patched, "UTF-8")
            }
        }

        ProcessBuilder pb = new ProcessBuilder("pip", "install", "-q", "git+https://github.com/mcbeet/mecha.git")
        pb.inheritIO()
        Process process = pb.start()
        process.waitFor()
    }

    workingDir = scratch
    commandLine "mecha", "."
}

tasks.register("lintPackMcmeta") {
    group = "verification"
    description = "Checks pack.mcmeta exists and is valid JSON for macroEngine and macroengine_extensions"
    doLast {
        [new File(macroEngineSrc, "pack.mcmeta"), new File(extensionsSrc, "pack.mcmeta")].each { meta ->
            if (!meta.exists()) {
                throw new GradleException("${meta} is missing!")
            }
            new JsonSlurper().parse(meta)
        }
        logger.lifecycle("pack.mcmeta files valid.")
    }
}

// ---------------------------------------------------------------------
// Lint: tekil (modern, 1.21+) ve cogul (legacy, 1.20.6-) klasor isimleri
// senkron mu? Ikisi de kaynakta var oluyor (bkz. macroEngine/data/*/function
// vs functions), build sirasinda her hedef zaten kendi isimlendirmesini
// seciyor (bkz. prepareMacroEngine task), ama bu iki taraf ICERIK olarak
// farkli olursa (birinde olup digerinde olmayan dosyalar) sessizce veri
// kaybi olur — build bunu asla otomatik cozmez, sadece raporlar.
// ---------------------------------------------------------------------
tasks.register("lintNamingConsistency") {
    group = "verification"
    description = "Reports files that exist under only one of the modern (singular) / legacy (plural) folder names"
    doLast {
        def pairs = [
            ["function", "functions"],
            ["advancement", "advancements"],
            ["loot_table", "loot_tables"],
            ["predicate", "predicates"],
            ["item_modifier", "item_modifiers"],
        ]
        def mismatches = []

        new File(macroEngineSrc, "data").eachDir { nsDir ->
            pairs.each { modern, legacy ->
                def modernDir = new File(nsDir, modern)
                def legacyDir = new File(nsDir, legacy)
                if (!modernDir.exists() || !legacyDir.exists()) return

                def modernRel = [] as Set
                modernDir.eachFileRecurse { f -> if (f.isFile()) modernRel << modernDir.toPath().relativize(f.toPath()).toString() }
                def legacyRel = [] as Set
                legacyDir.eachFileRecurse { f -> if (f.isFile()) legacyRel << legacyDir.toPath().relativize(f.toPath()).toString() }

                def onlyModern = modernRel - legacyRel
                def onlyLegacy = legacyRel - modernRel

                onlyModern.each { mismatches << "${nsDir.name}/${modern}/${it}  (only in ${modern}/, missing from ${legacy}/)" }
                onlyLegacy.each { mismatches << "${nsDir.name}/${legacy}/${it}  (only in ${legacy}/, missing from ${modern}/)" }
            }
        }

        if (mismatches) {
            logger.warn("::warning::${mismatches.size()} file(s) differ between modern (singular) and legacy (plural) folder names:")
            mismatches.each { logger.warn("  ${it}") }
            logger.warn("prepareMacroEngine artik her isimlendirmeyi kendi dogru hedefine (kok data/ vs 1_20_5/data/) ayiriyor, ama bu mismatch'ler bir tarafin icerigi eksik demek. Fix the source, not the build.")
        } else {
            logger.lifecycle("Modern/legacy folder naming is consistent — no mismatched files.")
        }
    }
}

tasks.register("lint") {
    group = "verification"
    description = "Runs all datapack lint checks"
    dependsOn "lintJson", "lintMcfunctionPrecheck", "lintMecha", "lintPackMcmeta", "lintNamingConsistency"
}

def buildTasks = []

// ---------------------------------------------------------------------
// macroEngine — tek pack, resmi Minecraft overlay mekanizmasini kullanir:
//   macroEngine.zip
//     pack.mcmeta     (pack_format 107, overlays.entries -> "1_20_5" format [40,42])
//     data/           (modern/tekil isimler: function, advancement, loot_table, predicate, item_modifier)
//     1_20_5/data/    (legacy/cogul isimler: functions, advancements, loot_tables, predicates, item_modifiers)
// Oyun format 40-42 arasindaysa 1_20_5/data/ icerigini data/ uzerine otomatik
// bindirir; format 107'de sadece kok data/ kullanilir. Iki ayri zip YOK —
// ayirma/isimlendirme sorumlulugu tamamen data kaynagindaki klasor adlarina
// ve pack.mcmeta'daki overlays.entries beyanina ait.
// ---------------------------------------------------------------------
def mainStageDir = new File(buildRoot, "macroEngine")

def modernOnlyDirs = ["**/function/**", "**/advancement/**", "**/loot_table/**", "**/predicate/**", "**/item_modifier/**"]
def legacyOnlyDirs = ["**/functions/**", "**/advancements/**", "**/loot_tables/**", "**/predicates/**", "**/item_modifiers/**"]

def prepareMainTask = tasks.register("prepareMacroEngine") {
    group = "build"
    description = "Assembles the macroEngine pack (root data/ modern + 1_20_5/data/ legacy overlay) into build/datapack/macroEngine"

    doLast {
        delete(mainStageDir)
        mkdir(mainStageDir)

        // Kok data/: sadece modern/tekil isimler. Kaynakta cogul isimler de
        // fiziksel olarak duruyor (bkz. lintNamingConsistency) — onlari
        // kok data/'a asla kopyalama, overlay klasorune ait.
        copy {
            from(macroEngineSrc) {
                exclude "1_20_5/**"
                exclude legacyOnlyDirs
            }
            into(mainStageDir)
        }

        // 1_20_5/data/: sadece cogul isimler, overlay klasorune gider.
        // Kaynak iki yerden gelebilir: (a) datapacks/macroEngine/1_20_5/data/
        // altinda zaten ayri tutulan legacy-only dosyalar, (b) kaynagin kok
        // data/'sinda cogul isimle duran dosyalar. Ikisi de 1_20_5/data/
        // altina toplanir, kok data/'ya hicbiri sizmaz.
        def overlayDataDir = new File(mainStageDir, "1_20_5/data")
        mkdir(overlayDataDir)

        def dedicatedOverlaySrc = new File(macroEngineSrc, "1_20_5/data")
        if (dedicatedOverlaySrc.exists()) {
            copy {
                from(dedicatedOverlaySrc) {
                    exclude modernOnlyDirs
                }
                into(overlayDataDir)
            }
        }

        copy {
            from(new File(macroEngineSrc, "data")) {
                include legacyOnlyDirs
            }
            into(overlayDataDir)
        }

        // pack.mcmeta: pack_format sabit 107, overlays.entries "1_20_5" ->
        // format [40,42] beyanini garanti eder (kaynakta zaten varsa dokunma,
        // yoksa ekle).
        def metaFile = new File(mainStageDir, "pack.mcmeta")
        def meta = new JsonSlurper().parse(metaFile)
        meta.pack.pack_format = TARGETS_PACK_FORMAT
        if (!meta.overlays) {
            meta.overlays = [:]
        }
        if (!meta.overlays.entries) {
            meta.overlays.entries = []
        }
        def hasOverlayEntry = meta.overlays.entries.any { it.directory == "1_20_5" }
        if (!hasOverlayEntry) {
            meta.overlays.entries << [formats: [40, 42], directory: "1_20_5"]
        }
        metaFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(meta))
    }
}

def zipMainTask = tasks.register("zipMacroEngine", Zip) {
    group = "build"
    description = "Packages the macroEngine pack (with 1_20_5 overlay) as a single zip artifact"
    dependsOn prepareMainTask
    from(mainStageDir)
    destinationDirectory.set(distRoot)
    archiveFileName.set("macroEngine.zip")
}

buildTasks << zipMainTask

def extensionsStageDir = new File(buildRoot, "extensions")

def prepareExtensionsTask = tasks.register("prepareExtensions") {
    group = "build"
    description = "Assembles macroengine_extensions into build/datapack/extensions"

    doLast {
        delete(extensionsStageDir)
        mkdir(extensionsStageDir)
        copy {
            from(extensionsSrc)
            into(extensionsStageDir)
        }
    }
}

def zipExtensionsTask = tasks.register("zipExtensions", Zip) {
    group = "build"
    description = "Packages macroengine_extensions as a zip artifact"
    dependsOn prepareExtensionsTask
    from(extensionsStageDir)
    destinationDirectory.set(distRoot)
    archiveFileName.set("macroengine_extensions.zip")
}

buildTasks << zipExtensionsTask

tasks.register("buildAll") {
    group = "build"
    description = "Builds macroEngine (with 1_20_5 overlay) + macroengine_extensions and repacks each zip to its minimal shape"
    dependsOn buildTasks
    finalizedBy "repack"
}

// ---------------------------------------------------------------------
// Repack — sifirdan yazildi. Iki farkli sonuc modeli var, zip adina gore
// secilir:
//   macroEngine.zip          -> pack.mcmeta + pack.png + data/ + 1_20_5/data/
//                                (resmi overlay yapisi, 1_20_5/ SADECE data/
//                                 alt klasorunu icerir, baska bir sey degil)
//   macroengine_extensions.zip -> pack.mcmeta + pack.png + data/ (overlay yok)
// Her iki durumda da pack.mcmeta yoksa build durur; macroEngine.zip icin
// ayrica 1_20_5/data/ eksikse de durur, cunku o zip'in butun amaci overlay
// tasimak.
// ---------------------------------------------------------------------
tasks.register("repack") {
    group = "build"
    description = "Trims each dist zip to its correct minimal shape (pack.mcmeta + data/ [+ 1_20_5/data/ for macroEngine.zip])"
    dependsOn buildTasks

    doLast {
        def scratch = layout.buildDirectory.dir("repack-scratch").get().asFile

        distRoot.listFiles({ f -> f.name.endsWith(".zip") } as FileFilter)?.each { zipFile ->
            def name = zipFile.name
            def isMainPack = (name == "macroEngine.zip")

            delete(scratch)
            mkdir(scratch)

            copy {
                from(zipTree(zipFile)) {
                    include "pack.mcmeta"
                    include "pack.png"
                    include "data/**"
                    if (isMainPack) {
                        include "1_20_5/data/**"
                    }
                }
                into(scratch)
            }

            if (!new File(scratch, "pack.mcmeta").exists()) {
                throw new GradleException("${name}: pack.mcmeta missing after filtering — refusing to repack.")
            }

            if (isMainPack && !new File(scratch, "1_20_5/data").exists()) {
                throw new GradleException("${name}: 1_20_5/data overlay missing after filtering — refusing to repack.")
            }

            delete(zipFile)

            ant.zip(destfile: zipFile, basedir: scratch)

            logger.lifecycle(isMainPack
                ? "Repacked ${name} -> pack.mcmeta + data/ + 1_20_5/data/ only"
                : "Repacked ${name} -> pack.mcmeta + data/ only")
        }
    }
}

tasks.register("release") {
    group = "publish"
    description = "Creates/updates the GitHub release for the macroEngine pack"
    dependsOn "zipMacroEngine", "repack"

    doLast {
        def metaFile = new File(mainStageDir, "pack.mcmeta")
        def meta = new JsonSlurper().parse(metaFile)
        def desc = meta.pack.description

        String version = null
        if (desc instanceof List) {
            desc.each { entry ->
                if (entry instanceof Map && entry.text) {
                    def m = (entry.text =~ /^\s*\|\s*(v[0-9][^\s]*)/)
                    if (m.find()) version = m.group(1)
                }
            }
        } else if (desc instanceof String) {
            def m = (desc =~ /v[\d.]+/)
            if (m.find()) version = m.group(0)
        }
        version = version ?: "latest"

        def zip = new File(distRoot, "macroEngine.zip")

        providers.exec { commandLine "bash", "-c", "gh release delete '${version}' --yes 2>/dev/null || true" }.result.get()
        providers.exec { commandLine "bash", "-c", "git push origin ':refs/tags/${version}' 2>/dev/null || true" }.result.get()
        providers.exec {
            commandLine "gh", "release", "create", version,
                "--title", "MacroEngine ${version}",
                "--notes", "**Datapack build** (pack_format 107, includes 1_20_5 overlay).",
                "--latest",
                "${zip}#macroEngine.zip"
        }.result.get()
        logger.lifecycle("Released ${version}")
    }
}

tasks.register('createSourceArchive', Copy) {
    description = 'Copies project files into the archive directory, excluding .git'
    from(rootDir) {
        exclude 'archive/**'
        exclude '.github/**'
        exclude '.git/**'
    }
    into layout.buildDirectory.dir('archive/source')
}

tasks.register('copyGitHistory', Copy) {
    description = 'Copies git history into the archive directory'
    dependsOn createSourceArchive
    from(rootDir) {
        include '.git/**'
    }
    into layout.buildDirectory.dir('archive/source')
}

tasks.register('createSourceZip', Zip) {
    description = 'Creates source-with-history.zip'
    dependsOn copyGitHistory
    from layout.buildDirectory.dir('archive/source')
    archiveFileName = 'source-with-history.zip'
    destinationDirectory = layout.buildDirectory.dir('archive')
}
